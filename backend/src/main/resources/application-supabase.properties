spring.application.name=warehouse

# --- Supabase PostgreSQL (project qyqmbayfhqzyzldvdbfw) ---
# Session pooler on :5432. Password via DB_PASSWORD env (do not hardcode — $ breaks Spring placeholders).
spring.datasource.url=jdbc:postgresql://aws-0-eu-west-2.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.qyqmbayfhqzyzldvdbfw
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render/Railway set PORT; local docker defaults to 8080.
server.port=${PORT:8080}

# Activate with: -Dspring-boot.run.profiles=supabase
# Requires DB_PASSWORD in the environment.
# Optional: CORS_ALLOWED_ORIGINS=https://your-frontend.vercel.app
