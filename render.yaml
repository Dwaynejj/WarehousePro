# Render Blueprint — deploy the Spring Boot API against Supabase Postgres.
# Dashboard: New → Blueprint → select this repo, or follow README “Hosting the backend”.
services:
  - type: web
    name: warehousepro-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
